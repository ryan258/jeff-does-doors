{{ if not .IsHome }}
  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <ol>
      <li><a href="{{ "" | relURL }}">Home</a></li>
      {{ with .Parent }}{{ if not .IsHome }}<li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>{{ end }}{{ end }}
      <li aria-current="page">{{ .Title }}</li>
    </ol>
  </nav>
{{ end }}
