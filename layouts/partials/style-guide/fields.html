<div class="sg-fields">
  <div><label for="sg-field-location">Project location <span>(required)</span></label><input id="sg-field-location" type="text" required aria-describedby="sg-location-help" autocomplete="off"><p id="sg-location-help">Example field. Town or area is enough for this discussion.</p></div>
  <div><label for="sg-field-error">Preferred contact email</label><input id="sg-field-error" type="email" value="example-address" aria-invalid="true" aria-describedby="sg-email-error" autocomplete="off"><p class="sg-field-error" id="sg-email-error">Example error: enter an email address with an @ and domain.</p></div>
  <div><label for="sg-field-service">Project stage</label><select id="sg-field-service"><option>Just exploring</option><option>Ready to discuss the scope</option><option>Need help with an existing door</option></select></div>
  <div><label for="sg-field-date">Appointment date</label><input id="sg-field-date" type="text" value="Arrange directly" disabled aria-describedby="sg-date-help"><p id="sg-date-help">Disabled example: no booking service is connected.</p></div>
</div>
