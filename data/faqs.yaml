- category: Hardware & how it moves
  featured: false
  items:
  - question: What is the door actually hanging from?
    answer: The selected track and mounting system carries the door. Check the exact door
      weight, hardware rating, structural support, and fastening instructions together.
      A photograph cannot establish what is behind the wall.
  - question: Can a sliding barn door lock?
    answer: There is no jamb to latch into, so privacy comes from face-mounted hardware such
      as a hook, a teardrop latch, or a small slide bolt. Treat it as a privacy signal rather
      than a bedroom lockset. Pull and latch placement should be decided together so both fall
      to hand.
  - question: Can a barn door be made quieter?
    answer: Most of the noise is mechanical. Sealed bearing rollers, a properly seated rail,
      soft-close dampers at each end, and a bottom guide that is not binding all reduce the
      rumble and the bang at the stops. Which hardware is available belongs in the conversation
      with Jeff.
  - question: My door rubs and drifts open on its own. What causes that?
    answer: Usually one of a few things. The rail is slightly out of level, the roller bolts
      have loosened, the bottom guide is off line, or the floor has a high spot. Describe when
      it started and what you hear, then photograph the rail, the guide, and the place where
      it rubs.
- category: Materials, finish & living with it
  featured: false
  items:
  - question: Is a solid door worth it over a hollow-core one?
    answer: Solid slabs feel steadier, hang truer, and block noticeably more sound. Hollow-core
      doors are lighter and cheaper, but they telegraph sound and give hardware less to fasten
      into. Either way, check the door weight against the rating of the rail and rollers.
  - question: Will a wood door warp?
    answer: Wood moves with the seasons. The usual protections are kiln-dried stock, a slab
      built to allow that movement, and finish applied to both faces and all edges so neither
      side takes on moisture faster. Rooms with steam or large humidity swings deserve extra
      thought.
  - question: Should I paint it or stain it?
    answer: Stain keeps the grain visible, so the species carries the room. Paint gives you
      a flat block of color instead. Look at samples in the real room light, morning and evening.
      A satin topcoat wipes down more easily than a dead flat one, which matters where hands
      and paws meet the door.
  - question: How much light and sound come through around the door?
    answer: Gaps around a face-mounted sliding door can pass light and sound. Discuss the
      privacy you need before choosing it. The door, overlap, glazing, and compatible seals
      all affect the result; do not assume a sound rating or a fixed gap.
