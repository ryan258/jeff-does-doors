- category: Barn-style doors
  featured: true
  items:
  - question: What does Jeff specialize in?
    answer: Barn-style doors. This draft focuses on interior sliding designs, with
      proposed supporting services for replacement doors, tracks and hardware, and
      adjustments. Jeff still needs to confirm the detailed service scope.
  - question: Could a barn door work in my room?
    answer: Start with a photo of the opening and the wall beside it. The room layout,
      trim, wall space, hardware, and the privacy you want all belong in the discussion
      before a door is chosen.
  - question: Does Jeff make custom doors or install doors I buy?
    answer: That arrangement has not been supplied yet. Share the look you want and
      any door you already have, then confirm who supplies or builds the door and
      who provides the hardware.
  - question: Does this form send a message to Jeff?
    answer: No. It prepares a draft in your browser that you can copy or download.
      Jeff’s contact details have not been supplied, and online delivery is disabled.
- category: Planning your project
  featured: false
  items:
  - question: What should I include in a first message?
    answer: Your town, where the door will go, the result you want, and any inspiration
      or product details. Keep photos for a later conversation; this preview does
      not upload them.
  - question: Should I order a door or track first?
    answer: Confirm the opening, product compatibility, and supply responsibilities
      before ordering. Include product links in your message if you have already found
      something you like.
  - question: Where does Jeff work?
    answer: The service area is awaiting confirmation. No town list or travel radius
      is claimed in this preview.
  - question: What will it cost?
    answer: No prices have been supplied for this draft. The door, hardware, opening
      conditions, preparation, and finish all help define what belongs in an estimate.
