- category: Barn-style doors
  featured: true
  items:
  - question: What does Jeff specialize in?
    answer: Interior barn-style doors, replacements, hardware, and adjustments. Confirm the
      exact scope directly. Hinges are where Jeff’s attention starts to wander.
  - question: Could a barn door work in my room?
    answer: Room layout, wall space, trim, hardware, and privacy all matter. Start with a photo
      of the opening and the wall beside it.
  - question: Does Jeff make custom doors or install doors I buy?
    answer: That arrangement is unconfirmed. Agree who supplies or builds the door and who provides
      the hardware before ordering.
  - question: Does this form send a message to Jeff?
    deliveryStatus: true
- category: Planning your project
  featured: false
  items:
  - question: What should I include in a first message?
    answer: Your town, the opening, what you want to change, and any product links. Keep photos
      ready for later; this preview does not upload them.
  - question: Should I order a door or track first?
    answer: Confirm fit, product compatibility, and supply responsibilities first. A saved link
      gives you something to discuss without committing to a purchase.
  - question: Where does Jeff work?
    answer: He is based in Bentonville. Coverage still needs confirmation. His map includes
      Dallas; Doreen’s includes travel time.
  - question: What will it cost?
    answer: The door, hardware, site conditions, preparation, and finish shape the estimate.
      Confirm the price and any follow-up terms in writing.
