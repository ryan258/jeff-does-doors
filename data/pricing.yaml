# "What does this usually cost?" Ranges are described, not quoted. No numbers are published.
disclaimer: Planning guidance, not a quote or confirmed service offer. Get the scope, price,
  and any return-visit terms in writing.
rows:
- service: Barn-door installation
  range: Scope to confirm
  drivers: Door size and material, rail system, mounting conditions, and finish.
  verified: true
- service: Replacement or swing-to-slide
  range: Scope to confirm
  drivers: Removal, reused parts, patching, trim, paint, and disposal.
  verified: true
- service: Track, rollers, and pulls
  range: Products to confirm
  drivers: Compatible products, mounting work, and finish choices. Black is a color, not a model
    number.
  verified: true
- service: Adjustments and repair
  range: Assessment needed
  drivers: The cause of the problem, existing parts, and the work agreed after assessment.
  verified: true
- service: Seasonal check-in
  range: Terms to agree
  drivers: Whether a check-in is needed, when, and on what terms. Jeff passing the house is
    not a booking.
  verified: true
- service: Custom door
  range: Availability to confirm
  drivers: Fabrication, material, design, finish, and who supplies it.
  verified: true
