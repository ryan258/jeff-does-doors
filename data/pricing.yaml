# "What does this usually cost?" Ranges are described, not quoted. No numbers are published.
disclaimer: "Not a quote. Every doorway is different: wall, trim, floor, light, and how long the opening has been without a door all move the number. Jeff prefers to stand in the opening before naming a price. He may stand there a while."
rows:
  - service: "Barn-door installation"
    range: "Depends on the door"
    drivers: "Door size and material, rail length, wall framing, finish. Jeff will tell you the door could be bigger. In Texas it would be."
    verified: true
  - service: "Replacement or swing-to-slide"
    range: "Depends on the old door"
    drivers: "Removal, patching, trim, paint. Disposal is optional: Jeff will take the old door with him. He has the room."
    verified: true
  - service: "Track, rollers, and pulls"
    range: "Depends on the hardware"
    drivers: "Rail length, roller type, finish. Jeff will not hang a door on a track he has not met."
    verified: true
  - service: "Adjustments and repair"
    range: "Per visit, mostly"
    drivers: "What is rubbing and why. Second visits are included. Third visits are included. Jeff will be in the area."
    verified: true
  - service: "Seasonal check-in"
    range: "Included"
    drivers: "Quarterly, or whenever Jeff is passing. He will ring the bell. You do not have to answer."
    verified: true
  - service: "Custom door"
    range: "Quoted per door"
    drivers: "Species, joinery, glass, finish. Jeff will want to know what the door is for, and what it will see."
    verified: true
