# Payment options. Terms are described in plain words and are not a contract.
intro: "Doors are best paid for without hurry. These are the ways it can work, so nobody has to rush a decision in front of the door."
options:
  - title: "A deposit to hold your door"
    body: "A deposit lets Jeff set a door aside for your opening. He will not lend it to another room."
    verified: true
  - title: "Payment on completion"
    body: "Due when the door slides the way you want it to. Jeff will ask whether it does. More than once."
    verified: true
  - title: "Card, check, or transfer"
    body: "All welcome. Jeff prefers a handshake and a few minutes alone with the door afterward."
    verified: true
  - title: "A payment plan"
    body: "Ask. Jeff would rather you spend on the door than on the paperwork."
    verified: true
accepted:
  - "Check"
  - "Cash"
  - "Card"
  - "Bank transfer"
  - "A kind word about the door"
