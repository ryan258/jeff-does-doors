# Payment options. Terms are described in plain words and are not a contract.
intro: A written agreement should say what is due, when, and how it can be paid.
options:
- title: Any deposit
  body: Confirm the amount, due date, and terms before paying. Setting a sample aside is not
    a deposit agreement.
  verified: true
- title: Completion payment
  body: Define the payment milestone and how remaining work is recorded. Jeff saying “look at
    that” is not an invoice.
  verified: true
- title: Payment methods
  body: Confirm accepted methods directly. Doreen would prefer that no one arrive with a door
    in trade.
  verified: true
- title: Installments, if available
  body: Ask whether an arrangement is available and get its terms in writing. No plan is offered
    through this page.
  verified: true
accepted:
- Methods awaiting confirmation
- Compliments on the door do not settle the balance
