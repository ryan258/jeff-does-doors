- step: '01'
  title: Show the space
  body: Send photos of the opening and the wall beside it, plus rough measurements
    and your town or ZIP code.
  drawing: photo
- step: '02'
  title: Find the look
  body: Talk through wood, proportions, hardware, and finish as one design for the
    room.
  drawing: swatches
- step: '03'
  title: Define the work
  body: Agree on supply, fitting, finishing, timing, and the estimate before anything
    is ordered or scheduled.
  drawing: plan
- step: '04'
  title: Fit the room
  body: The door, track, and pull come together in the opening they were planned
    for.
  drawing: door
