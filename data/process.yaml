- step: '01'
  title: Show the space
  body: Start with the opening, the room, and the wall beside it. Keep a few photos
    and your town or ZIP code ready.
- step: '02'
  title: Find the look
  body: Bring the style you have in mind. Talk through the door, finish, track, and
    pull as one complete design.
- step: '03'
  title: Define the work
  body: Confirm supply, fitting, finishing, timing, and the estimate before ordering
    or scheduling.
