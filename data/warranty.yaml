# Fictional follow-up habits shown on the homepage. Actual terms are unconfirmed.
verified: true
headline: The job isn’t over when the job is over.
body: Jeff stands behind his work. Mostly beside it, listening. These are fictional habits;
  actual warranty and service terms remain unconfirmed.
points:
- title: Jeff’s deadline
  body: He has not picked a date on which he stops wondering about the door.
- title: The binder
  body: Product paperwork, filed by model. Jeff wanted to file it by temperament.
- title: The check-in
  body: Doreen agrees any follow-up first. Jeff has stopped writing “passing anyway” in the
    calendar.
- title: The house rule
  body: No slamming. Jeff takes it personally; Lenny registers no opinion.
