# Workmanship guarantee shown on the homepage.
verified: true
headline: "The job isn’t over when the job is over."
body: "Jeff stands behind his work. Mostly beside it. Sometimes in the hallway, listening to it slide."
points:
  - title: "Workmanship term"
    body: "Open-ended. Jeff has not picked a date on which he stops wondering whether the door slides well."
  - title: "Manufacturer coverage"
    body: "Rails and rollers carry their own warranties. Jeff keeps the paperwork in a binder, filed by door."
  - title: "Callbacks"
    body: "If something is wrong, tell Jeff. If nothing is wrong, he would still like to hear how it is going."
  - title: "What is excluded"
    body: "Damage from slamming. Jeff takes slamming personally."
