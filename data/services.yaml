  catalogLabel: The door
  catalogImage: images/barn-door-oak-slab.webp
  catalogAlt: Illustrative flush oak sliding door in a bright hallway
  icon: barn-door
  summary: A new sliding door, planned with the room. Jeff considers the room a supporting role.
  bullets:
  - Introducing the door to the opening
  - Door style and finish choices
