- id: barn-door-replacement
  title: Door replacements & upgrades
  number: '02'
  kicker: A new look for a familiar space
  catalogLabel: The opening
  catalogDrawing: elevation
  catalogImage: images/barn-door-walnut.webp
  catalogAlt: Illustrative concept of a walnut sliding door between a bedroom and a bath
  icon: interior-door
  summary: A different door for a familiar opening. The farewell is between you and Jeff.
  bullets:
  - Existing barn-door replacements
  - Swing-to-slide project planning
  - A dignified send-off for the old door
  inquiryPrompt: Is this an existing slider or a swing-to-slide idea? List the parts you want
    to keep and what you want to change.
  relatedServices:
  - barn-door-installation
  - tracks-hardware
  costDrivers:
  - Condition and compatibility of retained parts
  - Trim, wall, and finish repairs
  - Removal and disposal arrangements
  questions:
  - question: Can the existing track stay?
    answer: Only after compatibility is checked against the replacement door and product instructions.
      “It’s already up there” is Jeff’s least favorite specification.
  - question: Can a swinging door become a barn-style door?
    answer: Assess the surrounding wall, clearances, and privacy needs first. Include both sides
      of the opening in your photos.
  - question: What happens to my old door?
    answer: Agree on removal and disposal as part of the scope. Jeff’s retirement plan for the
      door may require a separate conversation.
  path: barn-door-replacement
  searchTerms:
  - Door replacements & upgrades
