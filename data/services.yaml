  - question: Can I buy the hardware myself?
    answer: Confirm suitability and who supplies each part before ordering. A product link is
      useful; a box on the porch is harder to revise.
  - question: Can the hardware match the rest of the room?
    answer: Bring finish references, then check the available compatible options. Appearance
      and suitability both need to work.
