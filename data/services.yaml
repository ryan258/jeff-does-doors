  questions:
  - question: Is a barn-style door right for this opening?
    answer: Start with space to slide, room use, and privacy. Photos of the opening and adjacent
      wall help frame the assessment.
  - question: Does Jeff build the door or install a supplied one?
    answer: Supply and custom fabrication arrangements are unconfirmed. Agree who provides the
      door, hardware, and finish before buying anything.
  - question: Can the door be big? Jeff is from Dallas.
    answer: Size depends on the opening and the selected system’s requirements. Jeff’s birthplace
      is not a specification. Doreen has checked.
